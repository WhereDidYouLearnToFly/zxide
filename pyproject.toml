[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zxide"
version = "0.1.0"
description = "ZX Spectrum development IDE with a pure-Python emulator core"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    # SDL2, for reading a USB pad into the Kempston Joystick (zxemu_ui/gamepad.py).
    # PyQt5 has no gamepad module, and Windows' XInput sees only Xbox-protocol devices --
    # not the plain-HID USB NES/SNES clones people actually play Spectrum games with.
    "pygame>=2.0",
    # Writing the frame recorder's animated GIF (zxemu_ui/recorder.py). Imported lazily
    # so a missing Pillow costs you the export, not the whole IDE.
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Packaging zxide as a standalone app (build/build.ps1, build/build.sh). Needed only
# to produce a release build, never to run from source -- see build/README.md.
build = [
    "pyinstaller>=6.0",
]

# Flat layout: packages live at the repo root; main.py is a top-level entry script.
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zxemu_core*", "zxemu_ui*"]

[tool.setuptools.package-data]
zxemu_core = ["roms/*.rom", "roms/*.txt", "players/*.bin", "players/*.txt"]
zxemu_ui = ["templates/*/*", "addons/*/*"]

[project.scripts]
zxide = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
